<svg width="100%" viewBox="200 60 280 280" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>SG minimal dark logo</title>

  <defs>
    <linearGradient id="tail1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="tail2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8d8ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c8d8ff" stop-opacity="0.7"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&amp;display=swap');
    </style>
  </defs>

  <!-- Dark circle -->
  <circle cx="340" cy="200" r="140" fill="#0f111a"/>
  <circle cx="340" cy="200" r="140" fill="none" stroke="#2a2d3e" stroke-width="1.2"/>
  <circle cx="340" cy="200" r="132" fill="none" stroke="#1a1d2e" stroke-width="0.5"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="230" cy="118" r="1.2" opacity="0.6"/>
    <circle cx="210" cy="175" r="0.9" opacity="0.45"/>
    <circle cx="218" cy="258" r="1.0" opacity="0.5"/>
    <circle cx="260" cy="308" r="0.8" opacity="0.4"/>
    <circle cx="340" cy="88"  r="1.1" opacity="0.55"/>
    <circle cx="420" cy="98"  r="0.9" opacity="0.5"/>
    <circle cx="455" cy="155" r="1.2" opacity="0.6"/>
    <circle cx="462" cy="248" r="0.8" opacity="0.45"/>
    <circle cx="418" cy="302" r="1.0" opacity="0.5"/>
    <circle cx="340" cy="312" r="0.9" opacity="0.4"/>
  </g>

  <!-- Sparkles -->
  <g fill="#ffffff">
    <path d="M240,145 L241.5,150 L247,151.5 L241.5,153 L240,158 L238.5,153 L233,151.5 L238.5,150 Z" opacity="0.7"/>
    <path d="M438,240 L439,244 L443,245 L439,246 L438,250 L437,246 L433,245 L437,244 Z" opacity="0.6"/>
    <path d="M362,96  L363,99  L366,100 L363,101 L362,104 L361,101 L358,100 L361,99  Z" opacity="0.55"/>
  </g>

  <!-- Comet top-right -->
  <line x1="408" y1="112" x2="446" y2="92" stroke="url(#tail1)" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="406" cy="113" r="2" fill="#ffffff" opacity="0.9"/>

  <!-- Comet bottom-left -->
  <line x1="262" y1="278" x2="300" y2="258" stroke="url(#tail2)" stroke-width="1" stroke-linecap="round"/>
  <circle cx="260" cy="279" r="1.6" fill="#c8d8ff" opacity="0.85"/>

  <!-- SG — perfectly centred on circle cx=340 cy=200 -->
  <text
    x="340"
    y="200"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Cormorant Garamond', 'Garamond', 'Big Caslon', 'Palatino', serif"
    font-size="148"
    font-weight="300"
    fill="#ffffff"
    letter-spacing="12"
  >SG</text>

</svg>
